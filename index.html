<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu App de Estudos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Meu App de Estudos 🚀</h1>
        <p>Foco total na aprovação e revisão inteligente</p>
    </header>

    <main>
        <!-- Painel de Estatísticas / Placar -->
        <section class="painel-placar">
            <div class="card-stat">
                <span>Acertos</span>
                <strong id="stat-acertos">0</strong>
            </div>
            <div class="card-stat">
                <span>Erros (Para Revisão)</span>
                <strong id="stat-erros">0</strong>
            </div>
            <button id="btn-modo-revisao" class="btn-secundario">Revisar Erros (<span id="contador-revisao">0</span>)</button>
        </section>

        <!-- Filtros -->
        <section class="filtros">
            <h2>Filtros</h2>
            <select id="filtro-banca">
                <option value="">Todas as Bancas</option>
                <option value="Cesgranrio">Cesgranrio</option>
                <option value="FGV">FGV</option>
                <option value="CEBRASPE">CEBRASPE</option>
            </select>
            <button id="btn-filtrar">Filtrar</button>
            <button id="btn-todas" class="btn-secundario">Ver Todas</button>
        </section>

        <!-- Lista de Questões -->
        <section id="lista-questoes">
            <h2>Questões</h2>
            <div id="container-questoes">
                <!-- As questões vão aparecer aqui dinamicamente -->
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
