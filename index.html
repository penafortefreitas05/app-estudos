<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu App de Estudos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Meu App de Estudos 🚀</h1>
        <p>Foco total na aprovação e revisão inteligente</p>
    </header>

    <div class="container-app">
        <!-- BARRA LATERAL (Sidebar) -->
        <aside class="sidebar">
            <h3>Meu Desempenho</h3>
            <div class="card-stat">
                <span>Acertos Totais</span>
                <strong id="stat-acertos">0</strong>
            </div>
            <div class="card-stat">
                <span>Erros (Revisão)</span>
                <strong id="stat-erros">0</strong>
            </div>
            <button id="btn-modo-revisao" class="btn-pequeno">Revisar Erros (<span id="contador-revisao">0</span>)</button>
            <button id="btn-limpar-dados" class="btn-pequeno btn-perigo">Zerar Histórico</button>

            <!-- NOVO: Dashboard de Matérias -->
            <div id="dashboard-materias" class="dashboard-materias">
                <!-- As barras de progresso vão aparecer aqui -->
            </div>
        </aside>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="conteudo-principal">
            <!-- Filtros -->
            <section class="filtros">
                <select id="filtro-banca">
                    <option value="">Todas as Bancas</option>
                    <option value="Cesgranrio">Cesgranrio</option>
                    <option value="FGV">FGV</option>
                    <option value="CEBRASPE">CEBRASPE</option>
                </select>
                
                <!-- NOVO: Filtro de Matéria -->
                <select id="filtro-materia">
                    <option value="">Todas as Matérias</option>
                    <!-- O JavaScript vai preencher as matérias aqui automaticamente -->
                </select>

                <button id="btn-filtrar" class="btn-pequeno">Filtrar</button>
                <button id="btn-todas" class="btn-pequeno btn-secundario">Ver Todas</button>
            </section>

            <section id="lista-questoes">
                <div id="container-questoes"></div>
            </section>
        </main>
    </div>

   <!-- ... todo o resto do seu HTML acima ... -->
    
    <!-- 1º Carrega os dados -->
    <script src="questoes.js"></script>
    
    <!-- 2º Carrega a lógica que vai usar os dados -->
    <script src="app.js"></script>
</body>
</html>
</body>
</html>
