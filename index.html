<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- 1. METADADOS E PWA -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#020617">
    <title>FocoPro - Preparação Intensiva para Concursos</title>
    
    <!-- Ícone, Manifest e Estilos -->
    <link rel="icon" href="data:,">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Tipografia Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-layout">
        
        <!-- 2. PAINEL LATERAL (SIDEBAR & DESEMPENHO) -->
        <aside class="sidebar">
            <div class="brand">
                <h2>FocoPro ✦</h2>
                <p>Foco total na aprovação</p>
            </div>
            <!-- Perfil do Usuário -->
            <div class="user-profile" id="user-profile-container">
                <div class="user-avatar" id="user-avatar">?</div>
                <div class="user-info">
                    <span id="user-email" style="display: block; font-weight: 600; font-size: 0.8rem; overflow: hidden; text-overflow: ellipsis; max-width: 180px;">Visitante</span>
                    <button type="button" id="btn-auth-acao" class="btn-link" style="font-size: 0.75rem; margin-left: 0;">Fazer Login</button>
                </div>
            </div>

            <div class="menu-item active">
                🏠 Meu Desempenho
            </div>

            <!-- Card: Acertos Totais -->
            <div class="stat-card">
                <span class="stat-title">🎯 Acertos Totais</span>
                <span class="stat-value text-blue" id="stat-acertos">0</span>
                <div class="progress-bar-mini blue"></div>
            </div>

            <!-- Card: Erros Totais -->
            <div class="stat-card">
                <span class="stat-title">🔄 Erros Totais</span>
                <span class="stat-value text-orange" id="stat-erros">0</span>
                <div class="progress-bar-mini orange"></div>
            </div>

            <!-- Botão: Caderno de Erros / Modo Revisão -->
            <button id="btn-modo-revisao" class="btn-sidebar">
                <span>📑 Revisar Erros</span>
                <span class="badge-count" id="contador-revisao">0</span>
            </button>
            <!-- Botão para abrir o modal de importação -->
             <div>
               <button id="btnAbrirImportar" class="btn-acao" onclick="document.getElementById('modalImportar').style.display = 'flex'">
                Importar Questões em Massa
                </button>
             </div>




            <!-- Botão: Zerar Histórico -->
            <button id="btn-limpar-dados" class="btn-sidebar danger">
                <span>❌ Zerar Histórico</span>
            </button>

            <!-- Container Dinâmico do Desempenho por Matéria -->
            <div class="dashboard-container" id="dashboard-materias">
                <!-- Renderizado via js/ui.js -->
            </div>
        </aside>

        <!-- 3. ÁREA PRINCIPAL DE ESTUDOS -->
        <main class="main-content">
            
            <!-- Barra Superior de Filtros e Simulado -->
            <header class="top-bar">
                <div class="filtros-container">
                    <select id="filtro-banca" class="input-dark">
                        <option value="">🏛️ Todas as Bancas</option>
                    </select>
                    
                    <select id="filtro-materia" class="input-dark">
                        <option value="">📖 Todas as Matérias</option>
                    </select>

                    <div class="search-box">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="filtro-busca" class="input-dark" placeholder="Buscar palavra...">
                    </div>

                    <input type="number" id="qtd-simulado" class="input-dark num-input" placeholder="Qtd" min="1" max="100" title="Quantidade de questões">
                    <input type="number" id="tempo-simulado" class="input-dark num-input" placeholder="Min" min="1" max="240" title="Tempo em minutos">
                    
                    <button id="btn-simulado" class="btn-primary">▶ Gerar Simulado</button>
                    <button id="btn-todas" class="btn-secondary">⚙️ Ver Todas</button>
                </div>
            </header>

            <!-- Cronômetro Ativo do Simulado -->
            <div id="display-cronometro" class="cronometro-box">00:00</div>

            <!-- Feed Central de Questões -->
            <section id="container-questoes" class="questoes-grid">
                <!-- Renderizado via js/ui.js -->
            </section>
        </main>
    </div>
        <!-- ==================== INÍCIO: MODAL DE IMPORTAÇÃO EM MASSA ==================== -->
    <div id="modalImportar" class="modal">
        <div class="modal-conteudo">
            <h3>Importação em Massa</h3>
            <p>Cole o seu bloco de questões em formato JSON abaixo:</p>
            <textarea id="textoJsonQuestoes" rows="10" placeholder='[{"pergunta": "..."}]'></textarea>
            <div class="modal-botoes">
                <button type="button" id="btnFecharImportar" class="btn-secondary">Cancelar</button>
                <button type="button" id="btnProcessarImportacao" class="btn-primary">Processar</button>
            </div>
        </div>
    </div>
    <!-- ==================== FIM: MODAL DE IMPORTAÇÃO EM MASSA ==================== -->
    <!-- Modal de Importação -->
<!-- Modal Importar (Solto no final do body para pegar a tela toda) -->
    <div id="modalImportar" class="modal" style="display: none;">
        <div class="modal-conteudo">
            <h3>Importação em Massa</h3>
            <p>Cole o seu bloco de questões em formato JSON abaixo:</p>
            <textarea id="textoJsonQuestoes" rows="10" placeholder='[{"pergunta": "..."}]'></textarea>
            <div class="modal-botoes">
                <button id="btnProcessarImportacao" class="btn-primario">Processar</button>
                <button id="btnFecharImportar" class="btn-secundario"onclick="document.getElementById('modalImportar').style.display = 'none'"> cancelar

                
            </div>
        </div>
    </div>

    <!-- Scripts com type="module" OBRIGATÓRIO -->
    <script type="module" src="js/supabase.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/storage.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
</body>
</html>
